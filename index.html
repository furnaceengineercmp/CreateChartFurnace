var $=function(i){return document.getElementById(i)};
function d64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function e64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var salt=d64(P.s),iv=d64(P.v),data=d64(P.d),busy=false;
function say(t){$('msg').textContent=t||''}
function ready(){busy=false;$('go').disabled=false}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:P.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openApp(key,store){
  var buf;
  try{buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data)}catch(e){var w=new Error('pw');throw w}
  var bytes=new Uint8Array(buf),html;
  if(P.z){
    if(!window.DecompressionStream)throw new Error('browser');
    html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }else html=new TextDecoder().decode(bytes);
  if(store){try{var raw=await crypto.subtle.exportKey('raw',key);sessionStorage.setItem('cs_k',e64(new Uint8Array(raw)))}catch(x){}}
  document.open();document.write(html);document.close();
}
if(!(window.crypto&&crypto.subtle)){say('Halaman ini harus dibuka lewat alamat https:// (GitHub Pages).');$('go').disabled=true;return}
var k=null;try{k=sessionStorage.getItem('cs_k')}catch(x){}
if(k){
  crypto.subtle.importKey('raw',d64(k),{name:'AES-GCM'},false,['decrypt'])
    .then(function(key){return openApp(key,false)})
    .catch(function(){try{sessionStorage.removeItem('cs_k')}catch(x){}});
}
$('f').addEventListener('submit',async function(e){
  e.preventDefault();if(busy)return;busy=true;$('go').disabled=true;say('');
  try{
    var key=await derive($('pw').value);
    await openApp(key,true);
  }catch(err){
    var m=err&&err.message;
    say(m==='pw'?'Password salah.':(m==='browser'?'Browser terlalu lama. Perbarui Chrome atau Edge.':'Gagal membuka. Muat ulang halaman.'));
    ready();if(m==='pw')$('pw').select();
  }
});
})();
